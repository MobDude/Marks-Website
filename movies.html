<!DOCTYPE html>
<html lang="en">

        <head>
            <meta name="description" content="Mark's Movie Log">
            <meta name="author" content="Mark">
            <title>Movie Log | Mark</title>
            <link rel="icon" href="Images/Favicon.png">
            <link rel="stylesheet" href="css/base.css">
            <link rel="stylesheet" href="css/layout.css">
            <link rel="stylesheet" href="css/components.css">
            <link rel="stylesheet" href="css/movies.css">
        </head>

        <body>

        <!--header -->
        <header>

            <div class="header-inner">
                <nav>
                    <a href="index.html">Home</a>
                    <a href="projects.html">Projects</a>
                    <a href="about.html">About</a>
                    <a href="explore.html">Explore</a>
                    <a href="contact.html">Contact</a>
                </nav>

                <div class="header-controls">
                    <label class="font-toggle">
                        <input type="checkbox" id="font-toggle-checkbox">Custom Font
                    </label>

                    <label for="theme-selector">Theme:</label>
                    <select id="theme-selector">
                        <option value="default">Default</option>
                        <option value="light">Light</option>
                        <option value="cherry">Cherry</option>
                        <option value="dark">Dark</option>
                        <option value="midnight">Midnight</option>
                    </select>
                </div>

            </div>
        </header>

        <section class="hero">
            <h1>Movie Log</h1>
            <p>A collection of incredible, mediocre, and completely terrible films.</p>
        </section>

        <section class="movie-layout">

            <section id="movie-stats" class="movie-stats"></section>  
            <section id="movie-list" class="movie-list">
            
                <section class="movie-filters">
                    <span class="filter-label">Minimum Rating</span>

                    <div class="star-filter">
                        <button data-stars="0" class="active">All</button>
                        <button data-stars="0.5">⯨+</button>
                        <button data-stars="1">★+</button>
                        <button data-stars="1.5">★⯨+</button>
                        <button data-stars="2">★★+</button>
                        <button data-stars="2.5">★★⯨+</button>
                        <button data-stars="3">★★★+</button>
                        <button data-stars="3.5">★★★⯨+</button>
                        <button data-stars="4">★★★★+</button>
                        <button data-stars="4.5">★★★★⯨+</button>
                        <button data-stars="5">★★★★★</button>
                    </div>
                    
                    <div class="sort-controls">
                        <label for="sort-select">Sort By</label>

                        <select id="sort-select">
                            <option value="watch">Watch Order</option>
                            <option value="rating">Rating</option>
                            <option value="year">Year</option>
                            <option value="minutes">Duration</option>
                        </select>

                        <button id="sort-direction">⬇</button>
                    </div>
                    
                </section>
                <div id="movie-container"></div>
            </section>
        </section>

        <script src="movies.js"></script>
        <script src="theme.js"></script>
    </body>
</html>
